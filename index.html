*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:20px}

form{display:flex;flex-direction:column;gap:12px}
input{font:inherit;font-family:Outfit,sans-serif;font-weight:600;font-size:1.4rem;text-align:center;letter-spacing:.08em;text-transform:uppercase;padding:12px;border-radius:12px;border:2px solid rgba(246,243,232,.3);background:rgba(255,255,255,.06);color:var(--chalk)}

button{font:inherit;font-weight:600;font-size:1.05rem;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#26292f;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin-top:6px;font-size:.95rem}
.msg.ko{color:#ff9b8f}
.foot{margin-top:26px;font-size:.78rem;color:rgba(246,243,232,.55)}
