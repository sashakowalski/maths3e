*{box-sizing:border-box}

form{display:flex;flex-direction:column;gap:12px}

button{font:inherit;font-weight:600;font-size:1.05rem;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#26292f;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin-top:6px;font-size:.95rem}
