*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:20px}

form{display:flex;flex-direction:column;gap:12px}

button{font:inherit;font-weight:600;font-size:1.05rem;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#26292f;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin-top:6px;font-size:.95rem}
.msg.ko{color:#ff9b8f}

    e.preventDefault(); const c = inp.value; if (!norm(c)) return;
    ok.disabled = true; msg.className = 'msg'; msg.textContent = 'Ouverture…';
    try { await ouvrir(c); ecrire(norm(c)); }
    catch (err) { ok.disabled = false; inp.select(); afficher('Ce code n\'est pas le bon. Vérifie auprès de ton professeur.'); }
  };
  if (!window.crypto || !crypto.subtle) { afficher('Ton navigateur est trop ancien pour ouvrir ce site. Essaie avec un autre navigateur.'); ok.disabled = true; return; }
  const memo = lire();
  if (memo) ouvrir(memo).catch(() => { ecrire(null); afficher('Le code de la classe a changé. Tape le nouveau code.'); });
  else afficher();
})();
</script>
